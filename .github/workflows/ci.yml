name: Offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run affirmative demo
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | python lab.py | tee demo.txt
          grep -F "'days': 60, 'revision': 2" demo.txt
      - name: Run rejection demo
        shell: bash
        run: |
          set -o pipefail
          printf 'n\n' | python lab.py | tee rejected.txt
          grep -F '"kind": "rejected"' rejected.txt
          if grep -F '"kind": "executed"' rejected.txt; then exit 1; fi
      - name: Evaluate versioned governance scenarios
        run: python -m evals.run --output evaluation-report.json
