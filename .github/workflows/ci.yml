name: Offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tracked source and runtime imports
        run: python scripts/verify_source.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run affirmative demo
        shell: bash
        run: |
          set -o pipefail
          printf 'y\n' | python lab.py | tee demo.txt
          grep -F "'days': 60, 'revision': 2" demo.txt
      - name: Run rejection demo
        shell: bash
        run: |
          set -o pipefail
          printf 'n\n' | python lab.py | tee rejected.txt
          grep -F '"kind": "rejected"' rejected.txt
          if grep -F '"kind": "executed"' rejected.txt; then exit 1; fi
      - name: Evaluate versioned governance scenarios
        id: conformance
        run: python -m evals.run --repeat 3 --output evaluation-report.json
      - name: Upload synthetic conformance evidence
        if: always() && steps.conformance.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-conformance-${{ matrix.python-version }}
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
